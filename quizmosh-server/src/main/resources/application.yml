server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 10m
      cookie:
        secure: ${SECURE_COOKIES:true}
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: quizmosh
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/quizmosh;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
quizmosh:
  max-rooms: ${MAX_ROOMS:250}
  secure-cookies: ${SECURE_COOKIES:true}
logging:
  structured:
    format:
      console: logstash
  level:
    io.quizmosh: INFO
