server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: ludrivo
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/quizmosh;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
quizmosh:
  max-rooms: ${MAX_ROOMS:250}
logging:
  level:
    io.quizmosh: INFO
