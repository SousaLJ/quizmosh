name: QuizMosh checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: quizmosh-web/package-lock.json
      - run: bash scripts/build.sh
      - run: npm test --prefix quizmosh-web
      - run: docker build -t quizmosh-ci .
      - run: POSTGRES_PASSWORD=ci-ephemeral-password docker compose config --quiet
      - run: POSTGRES_PASSWORD=ci-ephemeral-password docker compose up -d --build --wait
      - name: Seed isolated smoke account
        run: |
          python3 -c "import secrets,os; open(os.environ['GITHUB_ENV'],'a').write('QUIZMOSH_SMOKE_ACCOUNT_TOKEN='+secrets.token_urlsafe(32)+'\n')"
      - run: python3 scripts/seed-smoke-account.py | POSTGRES_PASSWORD=ci-ephemeral-password docker compose exec -T database psql -v ON_ERROR_STOP=1 -U quizmosh -d quizmosh
      - run: python3 scripts/smoke.py http://127.0.0.1:8080
      - run: python3 scripts/mosh-smoke.py http://127.0.0.1:8080 en REGIONAL
      - run: node scripts/websocket-smoke.mjs http://127.0.0.1:8080
      - if: always()
        run: POSTGRES_PASSWORD=ci-ephemeral-password docker compose down -v
